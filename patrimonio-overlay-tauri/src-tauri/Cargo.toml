[package]
name = "patrimonio-overlay"
version = "1.0.0"
description = "Overlay de Gestion de Patrimonio en Tauri"
authors = ["Developer"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [ "window-all" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
